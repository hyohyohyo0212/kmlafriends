<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>운영진 화면</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="brand" href="index.html"><div class="logo-slot">KMLA Friends</div></a><div class="nav-links"><a href="participant.html">참가자 화면</a><a class="active" href="admin.html">운영진 화면</a><a href="room.html">매칭룸</a><a href="index.html">소개</a></div></nav>
<main><section id="login" class="panel" style="max-width:560px;margin:50px auto"><p class="eyebrow">ADMIN ONLY</p><h2>운영진 입장</h2><p class="desc">운영진 비밀번호를 입력하면 참가자, 매칭, 답변을 관리할 수 있습니다.</p><input id="pw" type="password" placeholder="비밀번호 입력"><button style="margin-top:16px" id="loginBtn">입장</button><p class="small" id="adminLoginStatus"></p></section>
<section id="dashboard" class="hidden"><div class="panel" style="margin-bottom:22px"><p class="eyebrow">ADMIN BOARD</p><h1>커플별 질문과<br>수동 매칭</h1><p class="desc">참가자 2명을 선택하고, 해당 커플에게만 보일 질문을 입력해 매칭을 생성합니다.</p><button id="loadBtn">새로고침</button></div>
<div class="grid2"><div class="panel form"><h2>커플별 질문 매칭</h2><label>참가자 A</label><select id="userA"></select><label>참가자 B</label><select id="userB"></select><label>이 커플에게 보여줄 질문</label><textarea id="pairQuestionText" rows="4" placeholder="예: 상대의 이런 점이 좋다!"></textarea><button id="createPairBtn" style="margin-top:18px">Pair Code 생성 후 매칭</button><p class="small" id="pairStatus"></p></div><div class="board panel"><h2>참가자 목록</h2><div id="userList" class="list"><div class="notice">아직 불러오지 않았습니다.</div></div></div></div>
<div class="grid2" style="margin-top:22px"><div class="board panel"><h2>매칭 결과</h2><div id="pairList" class="list"><div class="notice">아직 매칭이 없습니다.</div></div></div><div class="board panel"><h2>참가자 답변</h2><div id="answerList" class="list"><div class="notice">아직 답변이 없습니다.</div></div></div></div></section></main><footer>Admin Page</footer>
<script type="module" src="firebase.js"></script><script type="module">
let users=[],pairs=[],answers=[];loginBtn.onclick=async()=>{if(pw.value!=='bojima')return alert('비밀번호가 틀렸습니다.');try{adminLoginStatus.textContent='운영진 화면 접속 중...';if(!window.auth.currentUser){await window.fb.loginAnonymously()}login.classList.add('hidden');dashboard.classList.remove('hidden');await refreshAll()}catch(e){alert('운영진 화면 접속 실패: '+e.message)}};loadBtn.onclick=refreshAll;
async function refreshAll(){await loadUsers();await loadPairs();await loadAnswers()}
async function loadUsers(){const s=await window.fb.getDocs(window.fb.collection(window.db,'users'));users=s.docs.map(d=>({id:d.id,...d.data()}));if(!users.length){userList.innerHTML='<div class="notice">아직 기초 설문을 저장한 참가자가 없습니다.</div>';userA.innerHTML='';userB.innerHTML='';return}userList.innerHTML=users.map((u,i)=>`<div class="item"><b>${i+1}. ${u.nickname||'익명'} <span class="small">(${u.realName||'본명 없음'})</span></b><p>${u.keywords||''}<br>${u.style||''} · ${u.mood||''}<br>${u.intro||''}</p></div>`).join('');const opts=users.map(u=>`<option value="${u.uid}">${u.nickname||'익명'} (${u.realName||'본명 없음'})</option>`).join('');userA.innerHTML=opts;userB.innerHTML=opts}
async function loadPairs(){const s=await window.fb.getDocs(window.fb.collection(window.db,'pairs'));pairs=s.docs.map(d=>({id:d.id,...d.data()}));pairs.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));pairList.innerHTML=pairs.length?pairs.map(p=>`<div class="item"><b class="code">${p.code}</b><p>${p.a?.nickname||''} × ${p.b?.nickname||''}<br><span class="small">질문: ${p.question?.text||'질문 없음'}</span></p></div>`).join(''):'<div class="notice">아직 매칭이 없습니다.</div>'}
async function loadAnswers(){const s=await window.fb.getDocs(window.fb.collection(window.db,'answers'));answers=s.docs.map(d=>({id:d.id,...d.data()}));if(!answers.length){answerList.innerHTML='<div class="notice">아직 답변이 없습니다.</div>';return}answerList.innerHTML=answers.map(a=>{const user=users.find(u=>u.uid===a.uid);const pair=pairs.find(p=>p.code===a.pairCode);return `<div class="item"><b>${user?.nickname||'익명'} <span class="small">(${user?.realName||'본명 없음'})</span></b><p><span class="code">${a.pairCode||'pair 없음'}</span><br>질문: ${pair?.question?.text||a.questionText||'질문 없음'}<br>답변: ${a.text||''}</p></div>`}).join('')}
createPairBtn.onclick=async()=>{const uidA=userA.value,uidB=userB.value,questionText=pairQuestionText.value.trim();if(!uidA||!uidB||uidA===uidB)return alert('서로 다른 두 참가자를 선택해주세요.');if(!questionText)return alert('이 커플에게 보여줄 질문을 입력해주세요.');const a=users.find(u=>u.uid===uidA),b=users.find(u=>u.uid===uidB);const code=await makeUniquePairCode();const questionId=`${code}_${Date.now()}`;const pair={code,userA:uidA,userB:uidB,userIds:[uidA,uidB],a:publicUser(a),b:publicUser(b),question:{questionId,text:questionText},active:true,createdAt:new Date().toISOString()};await window.fb.setDoc(window.fb.doc(window.db,'pairs',code),pair);pairStatus.textContent=`매칭 생성 완료: ${code}`;pairQuestionText.value='';await refreshAll()};
function publicUser(u){return{uid:u.uid,realName:u.realName||'',nickname:u.nickname||'익명',keywords:u.keywords||'',style:u.style||'',mood:u.mood||'',intro:u.intro||''}}async function makeUniquePairCode(){for(let i=0;i<10;i++){const code=window.fb.randomPairCode();const snap=await window.fb.getDoc(window.fb.doc(window.db,'pairs',code));if(!snap.exists())return code}return window.fb.randomPairCode()+'-'+Date.now().toString().slice(-4)}
</script></body></html>
