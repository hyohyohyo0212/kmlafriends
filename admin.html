<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>운영진 화면</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html"><div class="logo-slot">로고 영역</div></a>
  <div class="nav-links">
    <a href="participant.html">참가자 화면</a>
    <a class="active" href="admin.html">운영진 화면</a>
    <a href="room.html">매칭룸</a>
    <a href="index.html">소개</a>
  </div>
</nav>

<main>
  <section id="login" class="panel" style="max-width:560px;margin:50px auto">
    <p class="eyebrow">ADMIN ONLY</p>
    <h2>운영진 비밀번호</h2>
    <p>시연용 비밀번호는 <b>1234</b> 입니다.</p>
    <input id="pw" type="password" placeholder="비밀번호 입력">
    <button style="margin-top:16px" id="loginBtn">입장</button>
    <p class="small" id="adminLoginStatus"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel" style="margin-bottom:22px">
      <p class="eyebrow">ADMIN BOARD</p>
      <h1 style="font-size:64px">질문 업로드와<br>수동 매칭</h1>
      <p class="desc">오늘의 질문을 업로드하고, 참가자 2명을 직접 선택하여 고정 페어를 생성합니다.</p>
      <button id="loadBtn">새로고침</button>
    </div>

    <div class="grid2">
      <div class="panel form">
        <h2>오늘의 질문 업로드</h2>
        <label>질문 ID</label>
        <input id="questionId" placeholder="예: 2026-QUESTION-01">

        <label>오늘의 질문</label>
        <textarea id="questionText" rows="4"></textarea>

        <button id="saveQuestionBtn" style="margin-top:18px">질문 저장</button>
        <p class="small" id="questionStatus"></p>
      </div>

      <div class="panel form">
        <h2>수동 매칭 생성</h2>
        <label>참가자 A</label>
        <select id="userA"></select>

        <label>참가자 B</label>
        <select id="userB"></select>

        <button id="createPairBtn" style="margin-top:18px">랜덤 Pair Code 생성 후 매칭</button>
        <p class="small" id="pairStatus"></p>
      </div>
    </div>

    <div class="grid2" style="margin-top:22px">
      <div class="board panel">
        <h2>참가자 목록</h2>
        <div id="userList" class="list"><div class="notice">아직 불러오지 않았습니다.</div></div>
      </div>

      <div class="board panel">
        <h2>매칭 결과</h2>
        <div id="pairList" class="list"><div class="notice">아직 매칭이 없습니다.</div></div>
      </div>
    </div>
  </section>
</main>

<footer>Admin Page</footer>

<script type="module" src="firebase.js"></script>
<script type="module">
let users = [];

loginBtn.onclick = async () => {
  if (pw.value !== '1234') {
    return alert('비밀번호가 틀렸습니다.');
  }

  try {
    adminLoginStatus.textContent = '운영진 화면 접속 중...';

    if (!window.auth.currentUser) {
      await window.fb.loginAnonymously();
    }

    login.classList.add('hidden');
    dashboard.classList.remove('hidden');
    await refreshAll();
  } catch (e) {
    alert('운영진 화면 접속 실패: ' + e.message);
  }
};

loadBtn.onclick = refreshAll;

async function refreshAll() {
  await loadUsers();
  await loadPairs();
  await loadTodayQuestion();
}

async function loadUsers() {
  const s = await window.fb.getDocs(window.fb.collection(window.db, 'users'));
  users = s.docs.map(d => ({ id: d.id, ...d.data() }));

  if (!users.length) {
    userList.innerHTML = '<div class="notice">아직 기초 설문을 저장한 참가자가 없습니다.</div>';
    userA.innerHTML = '';
    userB.innerHTML = '';
    return;
  }

  userList.innerHTML = users.map((u, i) => `
    <div class="item">
      <b>${i + 1}. ${u.nickname || '익명'}</b>
      <p>${u.keywords || ''}<br>${u.style || ''} · ${u.mood || ''}<br>${u.intro || ''}</p>
    </div>
  `).join('');

  const opts = users.map(u =>
    `<option value="${u.uid}">${u.nickname || '익명'} · ${u.keywords || ''}</option>`
  ).join('');

  userA.innerHTML = opts;
  userB.innerHTML = opts;
}

async function loadPairs() {
  const s = await window.fb.getDocs(window.fb.collection(window.db, 'pairs'));
  const pairs = s.docs.map(d => ({ id: d.id, ...d.data() }));

  pairs.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));

  pairList.innerHTML = pairs.length
    ? pairs.map(p => `
      <div class="item">
        <b class="code">${p.code}</b>
        <p>${p.a?.nickname || ''} × ${p.b?.nickname || ''}<br>
        <span class="small">운영진 수동 매칭</span></p>
      </div>
    `).join('')
    : '<div class="notice">아직 매칭이 없습니다.</div>';
}

async function loadTodayQuestion() {
  const snap = await window.fb.getDoc(
    window.fb.doc(window.db, 'settings', 'todayQuestion')
  );

  if (snap.exists()) {
    const d = snap.data();
    questionId.value = d.questionId || '';
    questionText.value = d.text || '';
    questionStatus.textContent = '현재 저장된 오늘의 질문을 불러왔습니다.';
  }
}

saveQuestionBtn.onclick = async () => {
  const qid = questionId.value.trim() || new Date().toISOString().slice(0, 10);
  const text = questionText.value.trim();

  if (!text) return alert('질문 내용을 입력해주세요.');

  try {
    saveQuestionBtn.disabled = true;
    questionStatus.textContent = '질문 저장 중...';

    await window.fb.setDoc(
      window.fb.doc(window.db, 'questions', qid),
      {
        questionId: qid,
        text,
        active: true,
        createdAt: window.fb.serverTimestamp()
      },
      { merge: true }
    );

    await window.fb.setDoc(
      window.fb.doc(window.db, 'settings', 'todayQuestion'),
      {
        questionId: qid,
        text,
        updatedAt: window.fb.serverTimestamp()
      },
      { merge: true }
    );

    questionStatus.textContent = '오늘의 질문이 저장되었습니다.';
  } catch (e) {
    alert('질문 저장 실패: ' + e.message);
  } finally {
    saveQuestionBtn.disabled = false;
  }
};

createPairBtn.onclick = async () => {
  const uidA = userA.value;
  const uidB = userB.value;

  if (!uidA || !uidB || uidA === uidB) {
    return alert('서로 다른 두 참가자를 선택해주세요.');
  }

  const a = users.find(u => u.uid === uidA);
  const b = users.find(u => u.uid === uidB);

  const code = await makeUniquePairCode();

  const pair = {
    code,
    userA: uidA,
    userB: uidB,
    userIds: [uidA, uidB],
    a: publicUser(a),
    b: publicUser(b),
    active: true,
    createdAt: new Date().toISOString()
  };

  await window.fb.setDoc(window.fb.doc(window.db, 'pairs', code), pair);

  pairStatus.textContent = `매칭 생성 완료: ${code}`;
  await loadPairs();
};

function publicUser(u) {
  return {
    uid: u.uid,
    nickname: u.nickname || '익명',
    keywords: u.keywords || '',
    style: u.style || '',
    mood: u.mood || '',
    intro: u.intro || ''
  };
}

async function makeUniquePairCode() {
  for (let i = 0; i < 10; i++) {
    const code = window.fb.randomPairCode();
    const snap = await window.fb.getDoc(window.fb.doc(window.db, 'pairs', code));
    if (!snap.exists()) return code;
  }

  return window.fb.randomPairCode() + '-' + Date.now().toString().slice(-4);
}
</script>
</body>
</html>
