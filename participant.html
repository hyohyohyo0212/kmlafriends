<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>참가자 화면</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="brand" href="index.html"><div class="logo-slot">KMLA Friends</div></a><div class="nav-links"><a class="active" href="participant.html">참가자 화면</a><a href="admin.html">운영진 화면</a><a href="room.html">매칭룸</a><a href="index.html">소개</a></div></nav>
<main><section class="split"><div class="panel"><p class="eyebrow">PARTICIPANT</p><h1>처음 1회<br>기초 설문</h1><p class="desc">익명 로그인 후 기초 설문을 저장합니다. 같은 브라우저에서는 로그인 상태가 유지되어 매칭룸에서도 다시 로그인할 필요가 없습니다.</p><div class="buttons"><button id="loginBtn">익명으로 로그인</button><button id="logoutBtn" class="ghost">로그아웃</button></div><div class="userbar" id="userbar">로그인 상태 확인 중입니다.</div><p class="small" id="status"></p></div>
<div class="panel form"><h2>기초 설문 조사</h2><p class="desc">오늘의 질문은 매칭 완료 후 매칭룸에서 공개됩니다.</p><label for="realName">본명</label><input id="realName" placeholder="예: 홍길동"><label for="nickname">익명 닉네임</label><input id="nickname" placeholder="예: 민트구름"><label for="keywords">나를 표현하는 키워드</label><input id="keywords" placeholder="예: 조용함, 음악, 산책"><label for="style">관계 형성 스타일</label><select id="style"><option>천천히 가까워지는 관계</option><option>활발한 대화</option><option>비슷한 고민 공유</option><option>서로 다른 생각을 들어보는 관계</option></select><label for="mood">처음 대화할 때 선호하는 분위기</label><select id="mood"><option>가볍고 편안한 분위기</option><option>진지한 고민을 나누는 분위기</option><option>서로 다른 생각을 들어보는 분위기</option></select><label for="intro">자유 소개</label><textarea id="intro" rows="5" placeholder="매칭 참고용 자기소개를 적어주세요."></textarea><button id="saveProfileBtn" style="width:100%;margin-top:18px">기초 설문 저장</button></div></section></main><footer>KMLA Friends</footer>
<script type="module" src="firebase.js"></script><script type="module">
let currentUser=null;function updateLoginUI(user){if(user){userbar.innerHTML='<span class="badge">로그인됨</span> 익명 사용자';loginBtn.style.display='none'}else{userbar.textContent='로그인 전입니다.';loginBtn.style.display='inline-block'}}
window.fb.onAuthStateChanged(window.auth,async(user)=>{currentUser=user;updateLoginUI(user);if(user){await loadProfile(user.uid)}});
loginBtn.onclick=async()=>{try{await window.fb.loginAnonymously()}catch(e){alert('로그인 실패: '+e.message)}};logoutBtn.onclick=async()=>{try{await window.fb.logout();location.reload()}catch(e){alert('로그아웃 실패: '+e.message)}};
async function loadProfile(uid){try{const snap=await window.fb.getDoc(window.fb.doc(window.db,'users',uid));if(!snap.exists())return;const d=snap.data();realName.value=d.realName||'';nickname.value=d.nickname||'';keywords.value=d.keywords||'';style.value=d.style||'천천히 가까워지는 관계';mood.value=d.mood||'가볍고 편안한 분위기';intro.value=d.intro||'';status.textContent='저장된 기초 설문을 불러왔습니다.'}catch(e){status.textContent='기초 설문을 불러오지 못했습니다.'}}
saveProfileBtn.onclick=async()=>{if(!currentUser)return alert('먼저 익명으로 로그인해주세요.');const data={uid:currentUser.uid,realName:realName.value.trim(),nickname:nickname.value.trim(),keywords:keywords.value.trim(),style:style.value,mood:mood.value,intro:intro.value.trim(),updatedAt:window.fb.serverTimestamp()};if(!data.realName||!data.nickname||!data.keywords||!data.intro)return alert('본명, 닉네임, 키워드, 자유 소개를 입력해주세요.');try{saveProfileBtn.disabled=true;status.textContent='저장 중...';await window.fb.setDoc(window.fb.doc(window.db,'users',currentUser.uid),data,{merge:true});status.textContent='기초 설문 저장 완료!'}catch(e){alert('저장 실패: '+e.message)}finally{saveProfileBtn.disabled=false}};
</script></body></html>
