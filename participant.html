<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>참가자 화면 - KMLA Friends</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #202124;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    .brand {
      text-decoration: none;
      color: #111827;
      font-weight: 800;
      font-size: 20px;
    }
    .logo-slot {
      padding: 8px 12px;
      border-radius: 12px;
      background: #eef2ff;
    }
    .nav-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .nav-links a {
      text-decoration: none;
      color: #6b7280;
      font-weight: 600;
    }
    .nav-links a.active {
      color: #4f46e5;
    }
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .panel {
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .eyebrow {
      color: #4f46e5;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 13px;
    }
    h1 {
      margin: 12px 0;
      font-size: 48px;
      line-height: 1.08;
    }
    h2 {
      margin-top: 0;
      font-size: 28px;
    }
    p {
      line-height: 1.7;
      color: #4b5563;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 800;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }
    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .userbar {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f3f4f6;
      color: #374151;
      font-weight: 700;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 800;
      color: #374151;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      background: white;
    }
    textarea {
      resize: vertical;
    }
    .small {
      font-size: 14px;
      color: #6b7280;
      margin-top: 14px;
    }
    @media (max-width: 800px) {
      nav {
        padding: 16px 20px;
        align-items: flex-start;
        gap: 12px;
        flex-direction: column;
      }
      .split {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="index.html">
      <div class="logo-slot">KMLA Friends</div>
    </a>
    <div class="nav-links">
      <a class="active" href="participant.html">참가자 화면</a>
      <a href="admin.html">운영진 화면</a>
      <a href="room.html">매칭룸</a>
      <a href="index.html">소개</a>
    </div>
  </nav>

  <main>
    <section class="split">
      <div class="panel">
        <p class="eyebrow">PARTICIPANT</p>
        <h1>처음 1회<br>기초 설문</h1>
        <p>
          익명 로그인 후 기초 설문을 저장합니다.
          이후에는 같은 브라우저에서 로그인 상태가 유지됩니다.
        </p>

        <div class="buttons">
          <button id="loginBtn">익명으로 로그인</button>
          <button id="logoutBtn" class="secondary">로그아웃</button>
        </div>

        <div class="userbar" id="userbar">로그인 전입니다.</div>
      </div>

      <div class="panel form">
        <h2>기초 설문 조사</h2>
        <p>오늘의 질문은 매칭 완료 후 매칭룸에서 공개됩니다.</p>

        <label for="nickname">익명 닉네임</label>
        <input id="nickname" placeholder="예: 민트구름" />

        <label for="keywords">나를 표현하는 키워드</label>
        <input id="keywords" placeholder="예: 조용함, 음악, 산책" />

        <label for="style">관계 형성 스타일</label>
        <select id="style">
          <option>천천히 가까워지는 관계</option>
          <option>활발한 대화</option>
          <option>비슷한 고민 공유</option>
          <option>서로 다른 생각을 들어보는 관계</option>
        </select>

        <label for="mood">처음 대화할 때 선호하는 분위기</label>
        <select id="mood">
          <option>가볍고 편안한 분위기</option>
          <option>진지한 고민을 나누는 분위기</option>
          <option>서로 다른 생각을 들어보는 분위기</option>
        </select>

        <label for="intro">자유 소개</label>
        <textarea id="intro" rows="5" placeholder="매칭 참고용 자기소개를 적어주세요."></textarea>

        <button id="saveProfileBtn" style="width:100%; margin-top:18px;">기초 설문 저장</button>
        <p class="small" id="status"></p>
      </div>
    </section>
  </main>

  <script type="module" src="firebase.js"></script>
  <script type="module">
    let currentUser = null;

    const userbar = document.getElementById('userbar');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const status = document.getElementById('status');

    const nickname = document.getElementById('nickname');
    const keywords = document.getElementById('keywords');
    const style = document.getElementById('style');
    const mood = document.getElementById('mood');
    const intro = document.getElementById('intro');

    window.fb.onAuthStateChanged(window.auth, async (user) => {
      currentUser = user;

      if (user) {
        userbar.textContent = '익명 사용자 접속 중입니다.';
        await loadProfile(user.uid);
      } else {
        userbar.textContent = '로그인 전입니다.';
      }
    });

    loginBtn.onclick = async () => {
      try {
        loginBtn.disabled = true;
        await window.fb.loginAnonymously();
      } catch (e) {
        alert('로그인 실패: ' + e.message);
      } finally {
        loginBtn.disabled = false;
      }
    };

    logoutBtn.onclick = async () => {
      try {
        await window.fb.logout();
        status.textContent = '';
      } catch (e) {
        alert('로그아웃 실패: ' + e.message);
      }
    };

    async function loadProfile(uid) {
      try {
        const snap = await window.fb.getDoc(
          window.fb.doc(window.db, 'users', uid)
        );

        if (snap.exists()) {
          const d = snap.data();

          nickname.value = d.nickname || '';
          keywords.value = d.keywords || '';
          style.value = d.style || '천천히 가까워지는 관계';
          mood.value = d.mood || '가볍고 편안한 분위기';
          intro.value = d.intro || '';

          status.textContent = '기초 설문을 불러왔습니다.';
        }
      } catch (e) {
        status.textContent = '기초 설문을 불러오지 못했습니다.';
      }
    }

    saveProfileBtn.onclick = async () => {
      if (!currentUser) {
        return alert('먼저 익명으로 로그인해주세요.');
      }

      const data = {
        uid: currentUser.uid,
        nickname: nickname.value.trim(),
        keywords: keywords.value.trim(),
        style: style.value,
        mood: mood.value,
        intro: intro.value.trim(),
        updatedAt: Date.now()
      };

      if (!data.nickname || !data.keywords || !data.intro) {
        return alert('닉네임, 키워드, 자유 소개를 입력해주세요.');
      }

      try {
        saveProfileBtn.disabled = true;
        status.textContent = '저장 중...';

        await window.fb.setDoc(
          window.fb.doc(window.db, 'users', currentUser.uid),
          data,
          { merge: true }
        );

        status.textContent = '기초 설문 저장 완료!';
      } catch (e) {
        alert('저장 실패: ' + e.message);
      } finally {
        saveProfileBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
