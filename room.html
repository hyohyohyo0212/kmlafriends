아래 room.html 전체를 그대로 교체해서 붙여넣어.

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>매칭룸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html"><div class="logo-slot">KMLA Friends</div></a>
  <div class="nav-links">
    <a href="participant.html">참가자 화면</a>
    <a href="admin.html">운영진 화면</a>
    <a class="active" href="room.html">매칭룸</a>
    <a href="index.html">소개</a>
  </div>
</nav>
<main>
  <section class="split">
    <div class="panel">
      <p class="eyebrow">PAIR ROOM</p>
      <h1>오늘의 질문과<br>답변</h1>
      <p class="desc">내 고정 페어와 오늘의 질문을 확인하고 답변합니다.</p>
      <div class="buttons">
        <button id="loginBtn">익명으로 로그인</button>
        <button class="ghost" id="logoutBtn">로그아웃</button>
      </div>
      <div class="userbar" id="userbar">로그인 상태 확인 중입니다.</div>
      <p class="small" id="roomStatus"></p>
    </div>
    <div class="panel form">
      <h2 class="question-title">오늘의 질문</h2>
      <div id="partnerBox" class="notice">상대 닉네임을 불러오는 중입니다.</div>
      <div id="questionBox" class="question" style="margin-top:14px">질문을 불러오는 중입니다.</div>
      <label>나의 답변</label>
      <textarea id="myAnswer" rows="6" placeholder="오늘의 질문에 답변해주세요."></textarea>
      <button id="saveAnswerBtn" style="width:100%;margin-top:18px">내 답변 저장</button>
      <p class="small" id="answerStatus"></p>
    </div>
  </section>
  <section id="answersSection" class="panel" style="margin-top:22px">
    <p class="eyebrow">ANSWERS</p>
    <h2>질문별 답변 기록</h2>
    <div id="historyList" class="list" style="margin-top:22px">
      <div class="notice">아직 답변 기록이 없습니다.</div>
    </div>
  </section>
</main>
<footer>Pair Room</footer>
<script type="module" src="firebase.js"></script>
<script type="module">
let currentUser = null;
let currentPair = null;
let pairQuestion = null;
let partnerUid = null;
let partnerNickname = '상대방';
function setLoggedInUI(user) {
  if (user) {
    userbar.innerHTML = '<span class="badge">로그인됨</span> 익명 사용자';
    loginBtn.style.display = 'none';
  } else {
    userbar.textContent = '로그인 전입니다.';
    loginBtn.style.display = 'inline-block';
  }
}
window.fb.onAuthStateChanged(window.auth, async (user) => {
  currentUser = user;
  setLoggedInUI(user);
  if (user) {
    await initializeRoom();
  } else {
    roomStatus.textContent = '참가자 화면에서 익명 로그인하면 이곳에서도 같은 로그인 상태가 유지됩니다.';
    questionBox.textContent = '로그인 후 질문을 확인할 수 있습니다.';
  }
});
loginBtn.onclick = async () => {
  try {
    await window.fb.loginAnonymously();
  } catch (e) {
    alert('로그인 실패: ' + e.message);
  }
};
logoutBtn.onclick = async () => {
  try {
    await window.fb.logout();
    location.reload();
  } catch (e) {
    alert('로그아웃 실패: ' + e.message);
  }
};
async function initializeRoom() {
  roomStatus.textContent = '내 매칭과 오늘의 질문을 불러오는 중입니다...';
  await loadMyPair();
  await loadTodayQuestion();
  if (currentPair && pairQuestion) {
    await loadAnswers();
  }
}
async function loadMyPair() {
  const snapshot = await window.fb.getDocs(
    window.fb.collection(window.db, 'pairs')
  );
  const pairs = snapshot.docs.map(d => d.data());
  currentPair = pairs.find(p =>
    Array.isArray(p.userIds) && p.userIds.includes(currentUser.uid)
  );
  if (!currentPair) {
    partnerBox.textContent = '아직 매칭된 상대가 없습니다.';
    questionBox.textContent = '운영진이 매칭과 질문을 생성하면 이곳에 표시됩니다.';
    roomStatus.textContent = '아직 운영진이 매칭을 생성하지 않았습니다.';
    return;
  }
  partnerUid = currentPair.userA === currentUser.uid
    ? currentPair.userB
    : currentPair.userA;
  const partner = currentPair.a?.uid === partnerUid
    ? currentPair.a
    : currentPair.b;
  partnerNickname = partner?.nickname || '상대방';
  partnerBox.innerHTML = `나의 매칭 상대: <span class="badge">${partnerNickname}</span>`;
  roomStatus.innerHTML = `내 Pair Code: <span class="code">${currentPair.code}</span>`;
}
async function loadTodayQuestion() {
  const snap = await window.fb.getDoc(
    window.fb.doc(window.db, 'settings', 'todayQuestion')
  );
  if (!snap.exists()) {
    questionBox.textContent = '아직 운영진이 오늘의 질문을 올리지 않았습니다.';
    pairQuestion = null;
    return;
  }
  const d = snap.data();
  pairQuestion = {
    questionId: d.questionId,
    text: d.text
  };
  questionBox.textContent = d.text || '질문 내용이 비어 있습니다.';
}
saveAnswerBtn.onclick = async () => {
  if (!currentUser) return alert('먼저 익명으로 로그인해주세요.');
  if (!currentPair) return alert('아직 매칭이 생성되지 않았습니다.');
  if (!pairQuestion) return alert('아직 오늘의 질문이 없습니다.');
  const text = myAnswer.value.trim();
  if (!text) return alert('답변을 입력해주세요.');
  const answerId = `${pairQuestion.questionId}_${currentPair.code}_${currentUser.uid}`;
  await window.fb.setDoc(
    window.fb.doc(window.db, 'answers', answerId),
    {
      answerId,
      questionId: pairQuestion.questionId,
      questionText: pairQuestion.text,
      pairCode: currentPair.code,
      uid: currentUser.uid,
      text,
      updatedAt: window.fb.serverTimestamp()
    },
    { merge: true }
  );
  answerStatus.textContent = '답변이 저장되었습니다.';
  myAnswer.value = '';
  await loadAnswers();
};
async function loadAnswers() {
  const snapshot = await window.fb.getDocs(
    window.fb.collection(window.db, 'answers')
  );
  const allAnswers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  const pairAnswers = allAnswers.filter(a => a.pairCode === currentPair.code);
  if (!pairAnswers.length) {
    historyList.innerHTML = '<div class="notice">아직 답변 기록이 없습니다.</div>';
    return;
  }
  const grouped = {};
  pairAnswers.forEach(a => {
    const key = a.questionId || 'unknown';
    if (!grouped[key]) {
      grouped[key] = {
        questionText: a.questionText || '질문 내용 없음',
        myAnswer: '',
        partnerAnswer: ''
      };
    }
    if (a.uid === currentUser.uid) {
      grouped[key].myAnswer = a.text || '';
    }
    if (a.uid === partnerUid) {
      grouped[key].partnerAnswer = a.text || '';
    }
  });
  historyList.innerHTML = Object.values(grouped).map(item => `
    <div class="item">
      <b>질문</b>
      <p>${item.questionText}</p>
      <b>나의 답변</b>
      <p>${item.myAnswer || '아직 답변하지 않았습니다.'}</p>
      <b>${partnerNickname}의 답변</b>
      <p>${item.partnerAnswer || `${partnerNickname}이 아직 답변하지 않았습니다.`}</p>
    </div>
  `).join('');
}
</script>
</body>
</html>
